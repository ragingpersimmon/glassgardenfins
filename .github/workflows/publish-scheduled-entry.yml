name: Publish scheduled journal entry

on:
  schedule:
    - cron: '0 7 15 9 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish due entry
        id: publish
        run: |
          node tools/publish-scheduled-entry.mjs
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.publish.outputs.changed == 'true'
        run: npm ci

      - name: Validate published site
        if: steps.publish.outputs.changed == 'true'
        run: npm test

      - name: Commit published entry
        if: steps.publish.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html journal/index.html journal/september-15-stocking-update/index.html
          git commit -m "Publish September 15 stocking update"
          git push

      - name: Configure Pages
        if: steps.publish.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Build Pages site
        if: steps.publish.outputs.changed == 'true'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload Pages artifact
        if: steps.publish.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v4

      - name: Deploy to GitHub Pages
        if: steps.publish.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
