name: Robustness Checks

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  validate-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic validation
        run: npm run validate:deterministic

      - name: Run chaos checks
        run: npm run test:chaos
