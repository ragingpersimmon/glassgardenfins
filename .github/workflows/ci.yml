name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run static invariant validation
        run: npm run validate:site

      - name: Run static mutation tests
        run: npm run test:mutations

      - name: Run deterministic browser tests
        run: npm run test:deterministic

      - name: Run chaos browser backtests
        run: npm run test:chaos
