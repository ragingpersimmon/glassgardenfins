name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      indexnow_payload: ${{ steps.indexnow.outputs.payload }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Rebuild generated files
        run: npm run build:site

      - name: Check generated files are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git --no-pager diff --stat
            echo "::error::Generated files are out of date. Run npm run build:site and commit the result."
            exit 1
          fi

      - name: Run static invariant validation
        run: npm run validate:site

      - name: Run whole-site integrity checks
        run: npm run check:integrity

      - name: Run static mutation tests
        run: npm run test:mutations

      - name: Build Pages artifact
        run: npm run build:artifact

      - name: Run deterministic browser tests against the artifact
        run: npm run test:deterministic
        env:
          SITE_ROOT: _site

      - name: Run chaos browser backtests against the artifact
        run: npm run test:chaos
        env:
          SITE_ROOT: _site

      - name: Run visual regression tests against the artifact
        run: npm run test:visual
        env:
          SITE_ROOT: _site

      - name: Upload visual test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: tests/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Plan IndexNow submission
        id: indexnow
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node ./tools/indexnow.mjs plan

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    needs: [validate, deploy]
    if: needs.validate.outputs.indexnow_payload != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Submit changed URLs to IndexNow
        run: node ./tools/indexnow.mjs submit
        env:
          INDEXNOW_PAYLOAD: ${{ needs.validate.outputs.indexnow_payload }}
