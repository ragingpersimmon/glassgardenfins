name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deterministic validation
        run: node ./tools/validate-site.mjs
      - name: Chaos validation
        run: node ./tools/chaos-test.mjs
